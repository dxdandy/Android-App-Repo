    <!-- Fish teeth / jaws accent -->
    <path d="M 72 48 L 76 54 L 68 53 L 64 58 L 60 52 L 54 56 L 52 50 L 46 54 L 44 48 Z" fill="#000000"/>
    <!-- Fish hook hanging at bottom -->
