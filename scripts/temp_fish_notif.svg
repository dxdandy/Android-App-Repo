    <path d="M 82 46 C 74 34, 60 26, 44 26 C 36 26, 28 29, 22 34 C 18 37, 14 42, 12 48 C 14 53, 20 57, 28 60 C 34 62, 42 63, 50 63 C 62 63, 72 58, 80 50 Z" opacity="0.95"/>
