<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiboPrognoza - Generator Aktivacijskih Ključeva</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #020617; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { background: #0f172a; border: 1px solid #334155; border-radius: 1.5rem; max-width: 460px; width: 100%; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    .badge { display: inline-block; background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.75rem; }
    h1 { font-size: 1.5rem; font-weight: 900; color: #ffffff; margin-bottom: 0.25rem; }
    p.sub { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.8rem; font-weight: 700; color: #cbd5e1; margin-bottom: 0.5rem; }
    input[type="text"], input[type="password"] { width: 100%; background: #020617; border: 1px solid #475569; border-radius: 0.75rem; padding: 0.75rem 1rem; color: #ffffff; font-size: 1rem; font-family: monospace; letter-spacing: 0.05em; text-transform: uppercase; text-align: center; margin-bottom: 1rem; outline: none; }
    input:focus { border-color: #f59e0b; }
    button { width: 100%; background: #f59e0b; color: #020617; border: none; border-radius: 0.75rem; padding: 0.85rem; font-size: 0.95rem; font-weight: 900; cursor: pointer; transition: all 0.2s; }
    button:hover { background: #d97706; }
    button:active { transform: scale(0.98); }
    .result-box { margin-top: 1.5rem; background: #020617; border: 1px solid rgba(245, 158, 11, 0.5); border-radius: 1rem; padding: 1.25rem; text-align: center; }
    .result-title { font-size: 0.75rem; text-transform: uppercase; color: #f59e0b; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: 0.05em; }
    .key-display { font-family: monospace; font-size: 1.4rem; font-weight: 900; color: #38bdf8; letter-spacing: 0.1em; background: #0f172a; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #1e293b; user-select: all; margin-bottom: 1rem; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .btn-secondary { background: #1e293b; color: #ffffff; font-size: 0.8rem; font-weight: 700; padding: 0.6rem; }
    .btn-secondary:hover { background: #334155; }
    .alert-error { color: #f87171; font-size: 0.8rem; font-weight: bold; text-align: center; margin-top: -0.5rem; margin-bottom: 1rem; }
    .footer-text { margin-top: 1.5rem; font-size: 0.75rem; color: #64748b; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Autor: Daniel Čizmar</div>
    <h1>Generator Licenci</h1>
    <p class="sub">Izračunaj aktivacijski ključ za bilo koji uređaj</p>

    <!-- Korak 1: PIN Provjera -->
    <div id="pin-section">
      <label>Unesite PIN (zadano: 2026):</label>
      <input type="password" id="admin-pin" placeholder="••••">
      <div id="pin-error" class="alert-error" style="display: none;">Pogrešan PIN.</div>
      <button onclick="unlockGenerator()">Pristupi Generatoru</button>
    </div>

    <!-- Korak 2: Generator -->
    <div id="gen-section" style="display: none;">
      <label>ID uređaja kupca / prijatelja:</label>
      <input type="text" id="target-id" placeholder="npr. RP-4A9B-8C2D">
      <button onclick="calculateKey()">Izračunaj Aktivacijski Ključ</button>

      <div id="result-box" class="result-box" style="display: none;">
        <div class="result-title">Aktivacijski ključ:</div>
        <div class="key-display" id="key-output">AKT-0000-0000</div>
        <div class="btn-row">
          <button class="btn-secondary" onclick="copyKey()">Kopiraj ključ</button>
          <button class="btn-secondary" onclick="shareWhatsApp()">Pošalji WhatsApp</button>
        </div>
      </div>
    </div>

    <div class="footer-text">RiboPrognoza • Kriptografska zaštita licence</div>
  </div>

  <script>
    const SECRET_SALT = 'DUNAV_ZANDER_DANIEL_CIZMAR_2026_PROTECT_KEY';
    const MASTER_PIN = '2026';

    function hashString(str) {
      let h1 = 0xdeadbeef;
      let h2 = 0x41c64e6d;
      for (let i = 0; i < str.length; i++) {
        const ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return [Math.abs(h1), Math.abs(h2)];
    }

    function generateKey(deviceId) {
      const cleanId = deviceId.trim().toUpperCase();
      const input = cleanId + ':' + SECRET_SALT;
      const [h1, h2] = hashString(input);
      const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      let b1 = '', b2 = '';
      let n1 = h1, n2 = h2;
      for (let i = 0; i < 4; i++) {
        b1 += chars.charAt(n1 % chars.length);
        n1 = Math.floor(n1 / chars.length);
        b2 += chars.charAt(n2 % chars.length);
        n2 = Math.floor(n2 / chars.length);
      }
      return 'AKT-' + b1 + '-' + b2;
    }

    function unlockGenerator() {
      const pin = document.getElementById('admin-pin').value.trim();
      if (pin === MASTER_PIN) {
        document.getElementById('pin-section').style.display = 'none';
        document.getElementById('gen-section').style.display = 'block';
      } else {
        document.getElementById('pin-error').style.display = 'block';
      }
    }

    function calculateKey() {
      const id = document.getElementById('target-id').value.trim();
      if (!id) return;
      const key = generateKey(id);
      document.getElementById('key-output').innerText = key;
      document.getElementById('result-box').style.display = 'block';
    }

    function copyKey() {
      const key = document.getElementById('key-output').innerText;
      navigator.clipboard.writeText(key).then(() => {
        alert('Ključ kopiran: ' + key);
      });
    }

    function shareWhatsApp() {
      const id = document.getElementById('target-id').value.trim();
      const key = document.getElementById('key-output').innerText;
      const text = 'Pozdrav! Tvoj aktivacijski ključ za RiboPrognoza aplikaciju (uređaj: ' + id + '):\n\n' + key + '\n\nUnesi ga u aplikaciju za trajno otključavanje.';
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }
  </script>
</body>
</html>
