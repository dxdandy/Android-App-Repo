    <meta charset="UTF-8" />
    <script>
      // Vite HMR is disabled in cloud iframe environment. Provide a silent dummy WebSocket handler for Vite HMR client
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          function ViteSilentWebSocket(url, protocols) {
            const urlStr = String(url || '');
            if (urlStr.includes('vite') || urlStr.includes('europe-west2.run.app') || urlStr.includes('ws://') || urlStr.includes('wss://')) {
              const emitter = new EventTarget();
              this.readyState = 1; // OPEN
              this.url = urlStr;
              this.protocol = protocols || '';
              this.extensions = '';
              this.bufferedAmount = 0;
              this.binaryType = 'blob';
              this.send = function() {};
              this.close = function() { this.readyState = 3; };
              this.addEventListener = emitter.addEventListener.bind(emitter);
              this.removeEventListener = emitter.removeEventListener.bind(emitter);
              this.dispatchEvent = emitter.dispatchEvent.bind(emitter);
              
              let _onopen = null, _onmessage = null, _onerror = null, _onclose = null;
              Object.defineProperties(this, {
                onopen: { get() { return _onopen; }, set(fn) { _onopen = fn; } },
                onmessage: { get() { return _onmessage; }, set(fn) { _onmessage = fn; } },
                onerror: { get() { return _onerror; }, set(fn) { _onerror = fn; } },
                onclose: { get() { return _onclose; }, set(fn) { _onclose = fn; } },
              });

              setTimeout(() => {
                if (typeof this.onopen === 'function') this.onopen(new Event('open'));
                emitter.dispatchEvent(new Event('open'));
              }, 10);
              return;
            }
            return new NativeWebSocket(url, protocols);
          }
          ViteSilentWebSocket.prototype = NativeWebSocket.prototype;
          ViteSilentWebSocket.CONNECTING = 0;
          ViteSilentWebSocket.OPEN = 1;
          ViteSilentWebSocket.CLOSING = 2;
          ViteSilentWebSocket.CLOSED = 3;
          window.WebSocket = ViteSilentWebSocket;
        }

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && (
            (typeof e.reason === 'string' && (e.reason.includes('WebSocket') || e.reason.includes('vite'))) ||
            (e.reason.message && (e.reason.message.includes('WebSocket') || e.reason.message.includes('vite') || e.reason.message.includes('createWebSocketModuleRunnerTransport')))
          )) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });
        window.addEventListener('error', function(e) {
          if (e && (
            (e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport'))) ||
            (e.filename && e.filename.includes('@vite/client'))
          )) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>

    <script type="module">
      window.__BUNDLED_APP_VERSION__ = "1.7.1";
      function isNewerVer(remoteVer, currentVer) {
        if (!remoteVer || !currentVer) return false;
        const rParts = String(remoteVer).replace(/^[vV]/, '').trim().split('.').map(n => parseInt(n, 10) || 0);
        const cParts = String(currentVer).replace(/^[vV]/, '').trim().split('.').map(n => parseInt(n, 10) || 0);
        for (let i = 0; i < Math.max(rParts.length, cParts.length); i++) {
          const r = rParts[i] || 0;
          const c = cParts[i] || 0;
          if (r > c) return true;
          if (r < c) return false;
        }
        return false;
      }
      function loadOtaFromIndexedDB() {
        return new Promise((resolve) => {
          try {
            if (!window.indexedDB) return resolve(null);
            const req = window.indexedDB.open('ribo_ota_code_db', 1);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains('bundles')) {
                db.createObjectStore('bundles');
              }
            };
            req.onsuccess = (e) => {
              try {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('bundles')) return resolve(null);
                const tx = db.transaction('bundles', 'readonly');
                const store = tx.objectStore('bundles');
                const getReq = store.get('active');
                getReq.onsuccess = () => resolve(getReq.result || null);
                getReq.onerror = () => resolve(null);
              } catch {
                resolve(null);
              }
            };
            req.onerror = () => resolve(null);
          } catch {
            resolve(null);
          }
        });
      }
      (async () => {
        let loadedOta = false;
        try {
          const ota = await loadOtaFromIndexedDB();
          if (ota && ota.version && ota.jsCode && isNewerVer(ota.version, window.__BUNDLED_APP_VERSION__)) {
            if (ota.cssCode) {
              const oldStyle = document.getElementById('ribo-ota-live-css');
              if (oldStyle) oldStyle.remove();
              const styleEl = document.createElement('style');
              styleEl.id = 'ribo-ota-live-css';
              styleEl.textContent = ota.cssCode;
              document.head.appendChild(styleEl);
            }
            window.__RUNNING_OTA_VERSION__ = ota.version;
            try {
              const blob = new Blob([ota.jsCode], { type: 'text/javascript' });
              const blobUrl = URL.createObjectURL(blob);
              await import(blobUrl);
              loadedOta = true;
            } catch (importErr) {
              console.warn('[RiboPrognoza OTA] Blob import nije uspio, pokušavam preko script taga:', importErr);
              const scriptEl = document.createElement('script');
              scriptEl.type = 'module';
              scriptEl.textContent = ota.jsCode;
              document.body.appendChild(scriptEl);
              loadedOta = true;
            }
            console.log('[RiboPrognoza OTA] Uspješno aktiviran Live Web paket v' + ota.version);
          }
        } catch (err) {
          console.warn('[RiboPrognoza OTA] Fallback na ugrađeni paket:', err);
        }
        if (!loadedOta) {
          window.__RUNNING_OTA_VERSION__ = window.__BUNDLED_APP_VERSION__;
          await import('/assets/app-bundle.js');
        }
      })();
    </script>
