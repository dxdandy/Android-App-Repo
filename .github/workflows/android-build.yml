name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug -x test -x lint --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RiboPrognoza.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiboPrognoza-APK
          path: RiboPrognoza.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: RiboPrognoza Najnovija Verzija (APK)
          body: |
            Nova verzija aplikacije RiboPrognoza.
            Preuzmite `RiboPrognoza.apk` na svoj Android telefon i instalirajte nadogradnju.
          files: RiboPrognoza.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
