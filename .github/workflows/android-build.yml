name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug -x test -x lint --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          VERSION=$(node -p "require('./public/version.json').version")
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Greška: Nije pronađena nijedna APK datoteka u android/app/build/outputs/apk/debug!"
            exit 1
          fi
          echo "Pronađen APK: $APK_FILE"
          cp "$APK_FILE" "RiboPrognoza_v${VERSION}.apk"
          echo "Pripremljena APK datoteka s verzijom u nazivu:"
          ls -la "RiboPrognoza_v${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiboPrognoza_v${{ env.APP_VERSION }}
          path: RiboPrognoza_v${{ env.APP_VERSION }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: RiboPrognoza v${{ env.APP_VERSION }} (APK)
          body: |
            Nova verzija aplikacije RiboPrognoza (v${{ env.APP_VERSION }}).
            Preuzmite `RiboPrognoza_v${{ env.APP_VERSION }}.apk` na svoj Android telefon.
          files: |
            RiboPrognoza_v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
